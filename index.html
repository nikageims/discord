<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nika Geims | Project Hub</title>
    <style>
        :root {
            --discord-blue: #5865F2;
            --discord-dark: #1e1f22; /* უფრო მუქი, თანამედროვე ფერი */
            --discord-gray: #2b2d31;
            --success-green: #23a55a;
            --accent-blue: #00a8fc;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            background-color: var(--discord-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #f2f3f5;
        }

        .main-wrapper {
            display: flex;
            gap: 40px;
            max-width: 1100px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* პროექტების სექცია */
        .projects-container {
            flex: 1;
            min-width: 350px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: left;
            border-bottom: 2px solid var(--discord-gray);
            padding-bottom: 10px;
        }

        .card {
            background: var(--discord-gray);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            border-color: var(--discord-blue);
        }

        .card h2 {
            margin: 0 0 12px 0;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card p {
            color: #dbdee1;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* ღილაკების სტილი */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--discord-blue);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #4752c4;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        /* Discord სექცია */
        .discord-section {
            width: 350px;
            background: var(--discord-gray);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            height: fit-content;
            border: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 20px;
        }

        .status-bar {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--success-green);
            border: 1px solid rgba(35, 165, 90, 0.2);
        }

        .dot {
            height: 12px;
            width: 12px;
            background-color: var(--success-green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(35, 165, 90, 0); }
            100% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0); }
        }

        iframe {
            border-radius: 8px;
            margin-bottom: 15px;
            background: #232428;
        }

        .join-btn {
            width: 80%;
            background: var(--success-green);
        }

        .join-btn:hover {
            background: #1e874b;
        }

        /* მობილური ვერსია */
        @media (max-width: 768px) {
            .discord-section {
                width: 100%;
                position: static;
            }
            .main-wrapper { gap: 20px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <div class="projects-container">
            <h1>ჩემი პროექტები</h1>

            <div class="card">
                <h2>🚀 CyberX</h2>
                <p>ინოვაციური პლატფორმა, რომელიც ფოკუსირებულია ტექნოლოგიურ განვითარებასა და მომხმარებლის გამოცდილებაზე. პროექტი აერთიანებს თანამედროვე ვებ-სტანდარტებს.</p>
                <a href="https://cyberrx.netlify.app/" target="_blank" class="btn">პროექტის ნახვა</a>
            </div>

            </div>

        <div class="discord-section">
            <h2 style="margin-bottom: 15px; font-size: 1.2rem;">Server Activity</h2>
            
            <div class="status-bar">
                <span class="dot"></span>
                <span id="online-count">...</span> წევრი ონლაინშია
            </div>
            
            <iframe src="https://discord.com/widget?id=1469051893526564987&theme=dark" 
                width="100%" height="450" allowtransparency="true" frameborder="0" 
                sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
            </iframe>

            <a href="https://discord.gg/JpVP4cnQvz" target="_blank" class="btn join-btn">შემოუერთდი სერვერს</a>
        </div>

    </div>

    <script>
        // ფუნქცია სტატუსის განახლებისთვის
        async function updateStatus() {
            try {
                const response = await fetch('https://discord.com/api/guilds/1469051893526564987/widget.json');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                document.getElementById('online-count').innerText = data.presence_count;
            } catch (error) {
                console.error("Discord API error:", error);
                document.getElementById('online-count').innerText = "0";
            }
        }

        // პირველი გაშვება და ინტერვალი
        updateStatus();
        setInterval(updateStatus, 30000);
    </script>

</body>
</html>
